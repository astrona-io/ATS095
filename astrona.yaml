# Course manifest for ATS095 - Source Controller & Repository Management (FluxCD).
#
# One entry per section under `modules:` (module-010 to module-050). Each
# section lists, in order: its README, then for each module the landing page
# (course.md), its parts (course-0N-*.md), and right after the part a lab
# tests, the lab's question.md reading and the `type: lab` entry. The
# module's summary page comes last. The section capstone closes the section,
# then the section quiz. Sections 010 to 030 hold two or three modules each
# (010-01..03, 020-01..03, 030-01..02), 040 holds two, 050 holds four.
# Playgrounds are not listed: the landing page's playground marker shows
# them. solution.md is never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS095
  title: "FluxCD: Source Controller & Repository Management"
  maturity: draft
  description: >
    Training material covering the Source Controller & Repository Management
    domain of the FluxCD training path: Git references, ignore rules and
    includes, HTTPS credentials and SSH deploy keys for GitRepository; Flux
    OCI artifacts, flux push artifact and OCIRepository tags, semver ranges
    and digests; HelmRepository and HelmChart objects for HTTP and OCI chart
    repositories; Bucket sources on S3-compatible storage; reconciliation
    triggers, Receivers and source notifications; and operating
    source-controller itself: how it stores artifacts, tuning and sizing,
    troubleshooting failing sources, and multi-tenant access.
    Each module pairs a layered reader with an ungraded hands-on playground
    and a graded practice lab. Each section closes with an integration
    capstone.
    Written for Flux v2.9.6.

  certification:
    name: FluxCD
    code: FLUX
    provider: Astrona

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

