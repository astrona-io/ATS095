# Pin A Release Line And Trim The Artifact
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and controllers, Gitea, the CoreDNS rewrite, and seeds gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-capstone-010-setup"
      description: "Tags v1.0.0, v1.2.0 and a broken v2.0.0, and points Flux at the open range >=1.0.0"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-semver-range"
      description: "Confirms fleet follows a semver range and is Ready on v1.2.0, without a pinned tag, name or commit"
      type: "file"
      source: "validation/validate-semver-range.sh"
    - name: "validate-artifact-trimmed"
      description: "Confirms the artifact of fleet holds apps/podinfo and no docs folder"
      type: "file"
      source: "validation/validate-artifact-trimmed.sh"
    - name: "validate-podinfo-release"
      description: "Confirms podinfo runs the v1.2.0 release: podinfo 6.15.0 with 2 ready replicas"
      type: "file"
      source: "validation/validate-podinfo-release.sh"
    - name: "validate-objects-kept"
      description: "Confirms the GitRepository and the Flux Kustomization were fixed in place, not deleted and recreated"
      type: "file"
      source: "validation/validate-objects-kept.sh"

teardown:
  keepCluster: false
