# Find Why A GitRepository Is Not Ready
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-lab-010-01-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and controllers, Gitea with SSH on port 2222, the CoreDNS rewrite, and seeds gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-lab-010-01-02-setup"
      description: "Creates the Secret fleet-auth and applies a GitRepository fleet that names a missing branch and a missing Secret"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-source-ready"
      description: "Confirms fleet is Ready on main@sha1 with ArtifactInStorage True and no FetchFailed"
      type: "file"
      source: "validation/validate-source-ready.sh"
    - name: "validate-secret-ref"
      description: "Confirms fleet references the existing Secret fleet-auth and no Secret fleet-credentials was created"
      type: "file"
      source: "validation/validate-secret-ref.sh"
    - name: "validate-spec-intact"
      description: "Confirms the address is unchanged, fleet follows main, is not suspended, and gitops/fleet has no release branch"
      type: "file"
      source: "validation/validate-spec-intact.sh"
    - name: "validate-sync"
      description: "Confirms the Flux Kustomization podinfo applies the revision of fleet and podinfo runs 2 ready replicas"
      type: "file"
      source: "validation/validate-sync.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
