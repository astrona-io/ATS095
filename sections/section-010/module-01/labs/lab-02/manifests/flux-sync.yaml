# The broken starting state: this GitRepository asks for a branch that does not
# exist and names a Secret that does not exist. The Secret that holds the
# working credentials is called fleet-auth.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30s
  url: http://gitea.localtest.me:3000/gitops/fleet.git
  ref:
    branch: release
  secretRef:
    name: fleet-credentials
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/podinfo
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: fleet
