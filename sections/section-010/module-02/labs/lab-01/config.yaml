# Repair A Git SSH Connection
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and controllers, Gitea with SSH on port 2222, the CoreDNS rewrite, and seeds gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-lab-010-02-setup"
      description: "Registers a read-only deploy key, creates fleet-ssh with the wrong known_hosts and a GitRepository with an address that has no port"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-source-ssh"
      description: "Confirms the GitRepository fleet uses the SSH address with port 2222 and the Secret fleet-ssh and is Ready on main"
      type: "file"
      source: "validation/validate-source-ssh.sh"
    - name: "validate-ssh-secret"
      description: "Confirms known_hosts of fleet-ssh holds a real host key of the Gitea SSH server for [gitea.localtest.me]:2222"
      type: "file"
      source: "validation/validate-ssh-secret.sh"
    - name: "validate-deploy-key"
      description: "Confirms fleet-ssh keeps the registered read-only deploy key and holds no password"
      type: "file"
      source: "validation/validate-deploy-key.sh"
    - name: "validate-sync"
      description: "Confirms the Flux Kustomization podinfo applies the revision of fleet and podinfo runs 2 ready replicas"
      type: "file"
      source: "validation/validate-sync.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
