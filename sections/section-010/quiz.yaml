# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats095-010
course_id: ATS095
exam_code: FLUX
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "GitRepository In Depth"
placement:
  position: after
  reading: sections/section-010/capstone/labs/lab-01/question.md
questions:
  - id: ats095-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the revision of a GitRepository"
    source_readings:
      - sections/section-010/module-01/course-01-choosing-a-git-reference.md
    prompt: "What does the revision of a `GitRepository`, such as `main@sha1:<commit>`, tell you?"
    options:
      - id: a
        text: "The reference source-controller resolved and the commit it fetched."
        explanation: "Correct. The part before the `@` is the reference and the part after it is the commit."
      - id: b
        text: "The time of the last fetch and the name of the user who pushed."
        explanation: "Not correct. The revision holds no time and no user name."
      - id: c
        text: "The name of the Flux `Kustomization` that uses the source."
        explanation: "Not correct. The revision describes the fetched content, not its consumers."
      - id: d
        text: "A hash of the files that remain after the ignore rules."
        explanation: "Not correct. The revision names the commit, not the contents of the artifact."
    correct_option: a
    explanation: "Correct. The part before the `@` is the reference and the part after it is the commit."

  - id: ats095-010-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know which ref field wins"
    source_readings:
      - sections/section-010/module-01/course-01-choosing-a-git-reference.md
    prompt: "A `GitRepository` sets both `ref.tag` and `ref.semver`. Which one does source-controller use?"
    options:
      - id: a
        text: "`tag`, because it is more exact than a range."
        explanation: "Not correct. `semver` wins over `tag`."
      - id: b
        text: "`semver`, because it wins over `tag`."
        explanation: "Correct. The later field in the list branch, tag, semver, name, commit wins."
      - id: c
        text: "Whichever field is written first in the YAML."
        explanation: "Not correct. The order of fields in the file does not matter."
      - id: d
        text: "Neither. The object fails validation."
        explanation: "Not correct. Setting more than one field is allowed. One of them wins."
    correct_option: b
    explanation: "Correct. The later field in the list branch, tag, semver, name, commit wins."

  - id: ats095-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain the default reference"
    source_readings:
      - sections/section-010/module-01/course-01-choosing-a-git-reference.md
    prompt: "A `GitRepository` has no `spec.ref` and the repository only has the branch `main`. What happens?"
    options:
      - id: a
        text: "source-controller follows `main` because it is the only branch."
        explanation: "Not correct. It does not look for a branch. It uses `master`."
      - id: b
        text: "source-controller fetches the newest tag."
        explanation: "Not correct. Tags are only used when `tag` or `semver` is set."
      - id: c
        text: "source-controller follows the branch `master`, so the source never becomes ready."
        explanation: "Correct. Without `ref`, the default branch name is `master`."
      - id: d
        text: "source-controller fetches the newest commit of any branch."
        explanation: "Not correct. It follows one branch, and the default is `master`."
    correct_option: c
    explanation: "Correct. Without `ref`, the default branch name is `master`."

  - id: ats095-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a semver range for a release line"
    source_readings:
      - sections/section-010/module-01/course-01-choosing-a-git-reference.md
    prompt: "The repository has the tags `v1.0.0`, `v1.1.0` and `v2.0.0`. Which commit does `ref.semver: \">=1.0.0 <2.0.0\"` fetch?"
    options:
      - id: a
        text: "The commit of `v2.0.0`, the newest tag."
        explanation: "Not correct. The upper bound `<2.0.0` excludes it."
      - id: b
        text: "The commit of `v1.0.0`, the first match."
        explanation: "Not correct. source-controller fetches the highest match, not the first."
      - id: c
        text: "The head of the branch `main`."
        explanation: "Not correct. A `semver` range reads tags, not branches."
      - id: d
        text: "The commit of `v1.1.0`, the highest tag inside the range."
        explanation: "Correct. `v2.0.0` is outside the upper bound, and the highest match is used."
    correct_option: d
    explanation: "Correct. `v2.0.0` is outside the upper bound, and the highest match is used."

  - id: ats095-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why SSH needs known_hosts"
    source_readings:
      - sections/section-010/module-01/course-03-https-and-ssh-authentication.md
    prompt: "What is the `known_hosts` key in an SSH Secret for Flux used for?"
    options:
      - id: a
        text: "It lets source-controller check that it talks to the real Git server."
        explanation: "Correct. source-controller refuses a host whose key is not listed."
      - id: b
        text: "It lists the users who may push to the repository."
        explanation: "Not correct. Users and push rights are managed on the Git server."
      - id: c
        text: "It holds the private key for signing in."
        explanation: "Not correct. The private key is in `identity`."
      - id: d
        text: "It holds the public key you register with the Git server."
        explanation: "Not correct. That key is `identity.pub`."
    correct_option: a
    explanation: "Correct. source-controller refuses a host whose key is not listed."

  - id: ats095-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what the default ignore rules leave out"
    source_readings:
      - sections/section-010/module-01/course-02-shaping-the-artifact.md
    prompt: "The commit holds `docs/diagram.png`, but the artifact does not. Why?"
    options:
      - id: a
        text: "The `docs` folder is always excluded from artifacts."
        explanation: "Not correct. Only the ignore rules decide. `docs/architecture.md` is in the artifact."
      - id: b
        text: "The default ignore rules leave out image files such as `.png`."
        explanation: "Correct. The built-in list excludes images, videos, archives and CI files."
      - id: c
        text: "Binary files are too large for an artifact."
        explanation: "Not correct. Size is not the reason. The ignore rules exclude the extension."
      - id: d
        text: "A `.sourceignore` file in the commit excludes it."
        explanation: "Not correct. The playground commit has no `.sourceignore`."
    correct_option: b
    explanation: "Correct. The built-in list excludes images, videos, archives and CI files."

  - id: ats095-010-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Tell spec.ignore from .sourceignore"
    source_readings:
      - sections/section-010/module-01/course-02-shaping-the-artifact.md
    prompt: "How does `spec.ignore` differ from a `.sourceignore` file?"
    options:
      - id: a
        text: "`spec.ignore` adds to the defaults, and `.sourceignore` replaces them."
        explanation: "Not correct. It is the other way round."
      - id: b
        text: "Both replace the defaults, but only `.sourceignore` is read from folders."
        explanation: "Not correct. Only `spec.ignore` replaces the defaults."
      - id: c
        text: "`spec.ignore` replaces the default rules, and `.sourceignore` adds to them."
        explanation: "Correct. Repeat any default rule you still need when you set `spec.ignore`."
      - id: d
        text: "Both add to the defaults and only differ in file format."
        explanation: "Not correct. They differ in whether the defaults stay."
    correct_option: c
    explanation: "Correct. Repeat any default rule you still need when you set `spec.ignore`."

  - id: ats095-010-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict when a .sourceignore takes effect"
    source_readings:
      - sections/section-010/module-01/course-02-shaping-the-artifact.md
    prompt: "`fleet` follows release tags. You push a `.sourceignore` file to `main`. When does it change the artifact?"
    options:
      - id: a
        text: "At the next interval, because source-controller reads `main`."
        explanation: "Not correct. The source follows tags, not `main`."
      - id: b
        text: "At once, because source-controller watches for the file."
        explanation: "Not correct. It does not watch for files."
      - id: c
        text: "Never. Only `spec.ignore` is supported on tag sources."
        explanation: "Not correct. `.sourceignore` works. It needs a commit that contains it."
      - id: d
        text: "Only after a new release tag that contains the file."
        explanation: "Correct. The file is part of a commit, so it only affects commits that contain it."
    correct_option: d
    explanation: "Correct. The file is part of a commit, so it only affects commits that contain it."

  - id: ats095-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use spec.include"
    source_readings:
      - sections/section-010/module-01/course-02-shaping-the-artifact.md
    prompt: "What does `spec.include` do in a `GitRepository`?"
    options:
      - id: a
        text: "It copies the artifact of another `GitRepository` into this artifact."
        explanation: "Correct. `fromPath` picks a folder and `toPath` sets where it lands."
      - id: b
        text: "It clones the submodules of the repository."
        explanation: "Not correct. That is `spec.recurseSubmodules`."
      - id: c
        text: "It adds files from any URL you write in the field."
        explanation: "Not correct. It names a Flux `GitRepository`, not a URL."
      - id: d
        text: "It re-adds files that the ignore rules removed."
        explanation: "Not correct. Ignore rules and includes are separate settings."
    correct_option: a
    explanation: "Correct. `fromPath` picks a folder and `toPath` sets where it lands."

  - id: ats095-010-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Register the right SSH key"
    source_readings:
      - sections/section-010/module-01/course-03-https-and-ssh-authentication.md
    prompt: "Which value do you register with Gitea as a read-only deploy key?"
    options:
      - id: a
        text: "The private key from `identity`."
        explanation: "Not correct. The private key never leaves the Secret."
      - id: b
        text: "The public key from `identity.pub`."
        explanation: "Correct. Only the public key goes to the Git server."
      - id: c
        text: "The password from the Secret `fleet-auth`."
        explanation: "Not correct. A password is not an SSH key."
      - id: d
        text: "The contents of `known_hosts`."
        explanation: "Not correct. That is the host key of the server, which Flux checks."
    correct_option: b
    explanation: "Correct. Only the public key goes to the Git server."

  - id: ats095-010-a2-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the TLS Secret keys"
    source_readings:
      - sections/section-010/module-02/course-01-tls-certificates-for-https-git-servers.md
    prompt: "Which Secret key holds the certificate authority that signed a private Git server's certificate?"
    options:
      - id: a
        text: "`tls.crt`"
        explanation: "Not correct. That key holds the client certificate."
      - id: b
        text: "`ca.crt`"
        explanation: "Correct. `ca.crt` holds the CA certificate source-controller trusts for the HTTPS connection."
      - id: c
        text: "`known_hosts`"
        explanation: "Not correct. That key is for SSH host keys."
      - id: d
        text: "`identity`"
        explanation: "Not correct. That key is the SSH private key."
    correct_option: b
    explanation: "Correct. `ca.crt` holds the CA certificate source-controller trusts for the HTTPS connection."

  - id: ats095-010-a2-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know when tls.crt is needed"
    source_readings:
      - sections/section-010/module-02/course-01-tls-certificates-for-https-git-servers.md
    prompt: "When does a `GitRepository` Secret need the keys `tls.crt` and `tls.key`?"
    options:
      - id: a
        text: "When the Git server requires a client certificate (mutual TLS)."
        explanation: "Correct. Both keys together enable mutual TLS, which only some servers require."
      - id: b
        text: "Always, for every HTTPS URL."
        explanation: "Not correct. Most servers need no client certificate."
      - id: c
        text: "When the repository is private."
        explanation: "Not correct. Privacy is handled by credentials, not by a client certificate."
      - id: d
        text: "When the branch is not `main`."
        explanation: "Not correct. The branch has no effect on TLS."
    correct_option: a
    explanation: "Correct. Both keys together enable mutual TLS, which only some servers require."

  - id: ats095-010-a2-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a certificate failure"
    source_readings:
      - sections/section-010/module-02/course-01-tls-certificates-for-https-git-servers.md
    prompt: "A `GitRepository` reports an unknown certificate authority for its HTTPS URL. What is the usual fix?"
    options:
      - id: a
        text: "Set a field that disables certificate checks."
        explanation: "Not correct. The `GitRepository` has no such field."
      - id: b
        text: "Change the URL to `http://`."
        explanation: "Not correct. That removes encryption and the server may refuse it."
      - id: c
        text: "Put the CA certificate in the key `ca.crt` of the Secret in `spec.secretRef`."
        explanation: "Correct. The controller does not know the private CA until it is in `ca.crt`."
      - id: d
        text: "Raise `spec.timeout`."
        explanation: "Not correct. A timeout does not affect trust."
    correct_option: c
    explanation: "Correct. The controller does not know the private CA until it is in `ca.crt`."

  - id: ats095-010-a2-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the proxy Secret key"
    source_readings:
      - sections/section-010/module-02/course-02-http-proxies-and-timeouts.md
    prompt: "Which key is required in the Secret named by `spec.proxySecretRef`?"
    options:
      - id: a
        text: "`url`"
        explanation: "Not correct. The key is called `address`."
      - id: b
        text: "`proxy`"
        explanation: "Not correct. The key is called `address`."
      - id: c
        text: "`host`"
        explanation: "Not correct. The key is called `address`."
      - id: d
        text: "`address`"
        explanation: "Correct. The Secret needs `address`; `username` and `password` are optional."
    correct_option: d
    explanation: "Correct. The Secret needs `address`; `username` and `password` are optional."

  - id: ats095-010-a2-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the proxy scope"
    source_readings:
      - sections/section-010/module-02/course-02-http-proxies-and-timeouts.md
    prompt: "Which URLs does `proxySecretRef` apply to?"
    options:
      - id: a
        text: "SSH URLs only."
        explanation: "Not correct. The proxy is for HTTP and HTTPS."
      - id: b
        text: "HTTP and HTTPS URLs, not SSH URLs."
        explanation: "Correct. `proxySecretRef` is for HTTP and HTTPS; SSH connections do not use it."
      - id: c
        text: "Every URL, including SSH."
        explanation: "Not correct. SSH does not use the proxy field."
      - id: d
        text: "Only URLs with a port."
        explanation: "Not correct. The port has no effect on this."
    correct_option: b
    explanation: "Correct. `proxySecretRef` is for HTTP and HTTPS; SSH connections do not use it."

  - id: ats095-010-a2-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the default fetch timeout"
    source_readings:
      - sections/section-010/module-02/course-02-http-proxies-and-timeouts.md
    prompt: "What is the default value of `spec.timeout` on a `GitRepository`?"
    options:
      - id: a
        text: "`60s`"
        explanation: "Correct. The default timeout is `60s`."
      - id: b
        text: "`10s`"
        explanation: "Not correct. The default is longer."
      - id: c
        text: "`5m`"
        explanation: "Not correct. The default is shorter."
      - id: d
        text: "There is no default; the fetch never times out."
        explanation: "Not correct. The field has a default of `60s`."
    correct_option: a
    explanation: "Correct. The default timeout is `60s`."

  - id: ats095-010-a2-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a token field"
    source_readings:
      - sections/section-010/module-02/course-03-tokens-bearer-authentication-and-git-providers.md
    prompt: "Where does a personal access token for GitHub go in the Secret of a `GitRepository`?"
    options:
      - id: a
        text: "In the key `identity`."
        explanation: "Not correct. That key is for SSH."
      - id: b
        text: "In the key `known_hosts`."
        explanation: "Not correct. That key is for SSH host keys."
      - id: c
        text: "In the key `password`, with any `username`, for basic authentication."
        explanation: "Correct. Hosted services expect the token where a password goes."
      - id: d
        text: "In `ca.crt`."
        explanation: "Not correct. That key is for certificate authorities."
    correct_option: c
    explanation: "Correct. Hosted services expect the token where a password goes."

  - id: ats095-010-a2-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the GitHub App provider"
    source_readings:
      - sections/section-010/module-02/course-03-tokens-bearer-authentication-and-git-providers.md
    prompt: "Which `spec.provider` value makes a `GitRepository` sign in as a GitHub App?"
    options:
      - id: a
        text: "`generic`"
        explanation: "Not correct. That is the default and uses the Secret as it is."
      - id: b
        text: "`azure`"
        explanation: "Not correct. That is for Azure DevOps."
      - id: c
        text: "`app`"
        explanation: "Not correct. That is not a valid value."
      - id: d
        text: "`github`"
        explanation: "Correct. `provider: github` with the app keys in the Secret enables GitHub App authentication."
    correct_option: d
    explanation: "Correct. `provider: github` with the app keys in the Secret enables GitHub App authentication."

  - id: ats095-010-a2-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Write a known_hosts entry"
    source_readings:
      - sections/section-010/module-02/course-04-ssh-host-keys-and-known-hosts.md
    prompt: "How is the `known_hosts` host written for a Git SSH server `git.example.com` that listens on port 2222?"
    options:
      - id: a
        text: "`[git.example.com]:2222`"
        explanation: "Correct. A host on a port other than 22 is written with brackets: `[host]:port`."
      - id: b
        text: "`git.example.com`"
        explanation: "Not correct. That entry belongs to port 22."
      - id: c
        text: "`git.example.com:2222`"
        explanation: "Not correct. Without square brackets the port is not understood."
      - id: d
        text: "`ssh://git.example.com:2222`"
        explanation: "Not correct. `known_hosts` takes host names, not URLs."
    correct_option: a
    explanation: "Correct. A host on a port other than 22 is written with brackets: `[host]:port`."

  - id: ats095-010-a2-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Handle a changed host key"
    source_readings:
      - sections/section-010/module-02/course-04-ssh-host-keys-and-known-hosts.md
    prompt: "The host key of the Git SSH server changed and `fleet` stopped fetching. What is the correct response?"
    options:
      - id: a
        text: "Delete `known_hosts` so that Flux skips the check."
        explanation: "Not correct. Flux refuses to connect without a key to check."
      - id: b
        text: "Scan the server, check that the new key is genuine, and replace `known_hosts` in the Secret."
        explanation: "Correct. The host key check stays on; only the stored key is updated after verifying it."
      - id: c
        text: "Create a new key pair and a new deploy key."
        explanation: "Not correct. The client key was not the problem."
      - id: d
        text: "Switch to HTTP."
        explanation: "Not correct. That gives up the security the task wants."
    correct_option: b
    explanation: "Correct. The host key check stays on; only the stored key is updated after verifying it."

  - id: ats095-010-m3-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the verify modes"
    source_readings:
      - sections/section-010/module-03/course-01-verify-commit-and-tag-signatures.md
    prompt: "Which value of `spec.verify.mode` checks both the commit and the tag?"
    options:
      - id: a
        text: "`HEAD`"
        explanation: "Not correct. `HEAD` is not the answer here. The modes are `HEAD`, `Tag` and `TagAndHEAD`."
      - id: b
        text: "`Tag`"
        explanation: "Not correct. `Tag` is not the answer here. The modes are `HEAD`, `Tag` and `TagAndHEAD`."
      - id: c
        text: "`TagAndHEAD`"
        explanation: "Correct. The modes are `HEAD`, `Tag` and `TagAndHEAD`."
      - id: d
        text: "`Both`"
        explanation: "Not correct. `Both` is not the answer here. The modes are `HEAD`, `Tag` and `TagAndHEAD`."
    correct_option: c
    explanation: "Correct. The modes are `HEAD`, `Tag` and `TagAndHEAD`."

  - id: ats095-010-m3-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the verify result"
    source_readings:
      - sections/section-010/module-03/course-01-verify-commit-and-tag-signatures.md
    prompt: "Which condition reports the result of signature verification on a `GitRepository`?"
    options:
      - id: a
        text: "`SourceVerifiedCondition`"
        explanation: "Correct. It is `True` with the reason `Succeeded` or `False` with the reason `Failed`."
      - id: b
        text: "`SignatureReady`"
        explanation: "Not correct. `SignatureReady` is not the answer here. It is `True` with the reason `Succeeded` or `False` with the reason `Failed`."
      - id: c
        text: "`FetchFailed`"
        explanation: "Not correct. `FetchFailed` is not the answer here. It is `True` with the reason `Succeeded` or `False` with the reason `Failed`."
      - id: d
        text: "`Stalled`"
        explanation: "Not correct. `Stalled` is not the answer here. It is `True` with the reason `Succeeded` or `False` with the reason `Failed`."
    correct_option: a
    explanation: "Correct. It is `True` with the reason `Succeeded` or `False` with the reason `Failed`."

  - id: ats095-010-m3-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Key suffixes"
    source_readings:
      - sections/section-010/module-03/course-01-verify-commit-and-tag-signatures.md
    prompt: "How does source-controller tell an SSH public key from a PGP public key in the verify Secret?"
    options:
      - id: a
        text: "By the suffix: `.sshpub` for SSH and `.asc` for PGP"
        explanation: "Correct. Other suffixes are read as a PGP keyring."
      - id: b
        text: "By the name of the Secret"
        explanation: "Not correct. By the name of the Secret is not the answer here. Other suffixes are read as a PGP keyring."
      - id: c
        text: "By the size of the key"
        explanation: "Not correct. By the size of the key is not the answer here. Other suffixes are read as a PGP keyring."
      - id: d
        text: "By the label on the Secret"
        explanation: "Not correct. By the label on the Secret is not the answer here. Other suffixes are read as a PGP keyring."
    correct_option: a
    explanation: "Correct. Other suffixes are read as a PGP keyring."

  - id: ats095-010-m3-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Failed verification"
    source_readings:
      - sections/section-010/module-03/course-01-verify-commit-and-tag-signatures.md
    prompt: "A commit fails verification. What happens to that revision?"
    options:
      - id: a
        text: "It is stored and applied with a warning"
        explanation: "Not correct. It is stored and applied with a warning is not the answer here. No artifact is stored, so no `Kustomization` can apply it."
      - id: b
        text: "It is not stored, and the `GitRepository` is not Ready"
        explanation: "Correct. No artifact is stored, so no `Kustomization` can apply it."
      - id: c
        text: "It is stored but marked unsafe"
        explanation: "Not correct. It is stored but marked unsafe is not the answer here. No artifact is stored, so no `Kustomization` can apply it."
      - id: d
        text: "It is applied only after one hour"
        explanation: "Not correct. It is applied only after one hour is not the answer here. No artifact is stored, so no `Kustomization` can apply it."
    correct_option: b
    explanation: "Correct. No artifact is stored, so no `Kustomization` can apply it."

