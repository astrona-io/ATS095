apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m
  # Fault 1: the repository is podinfo-manifests, not podinfo-manifest.
  url: oci://registry.localtest.me:5001/podinfo-manifest
  # Fault 2: the registry uses plain HTTP and the field insecure is missing.
  ref:
    # Fault 3: the tag 1.1 does not exist; the release is 1.1.0.
    tag: "1.1"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 5m
  path: ./
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: OCIRepository
    name: podinfo
