apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m
  url: oci://registry.localtest.me:5001/podinfo-manifests
  ref:
    tag: 1.1.0
  insecure: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 5m
  path: ./
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: OCIRepository
    name: podinfo
