    correct_option: a
    explanation: "Correct. Credentials are found by registry address."

  - id: ats095-020-m2-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reading a 401"
    source_readings:
      - sections/section-020/module-02/course-01-registry-credentials-with-a-pull-secret.md
    prompt: "The registry answers 401 to the source. What is the most likely cause?"
    options:
      - id: a
        text: "The node has no network"
        explanation: "Not correct. The node has no network is not the answer here. 401 means the registry wants a sign-in; a missing tag is a different error."
      - id: b
        text: "The source sends no credentials or wrong ones"
        explanation: "Correct. 401 means the registry wants a sign-in; a missing tag is a different error."
