# Make A HelmRelease's Chart Resolve
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-capstone-030-setup"
      description: "Applies a HelmRepository with a wrong address and a HelmRelease with a wrong source and range"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-repository"
      description: "Confirms the HelmRepository podinfo points at https://stefanprodan.github.io/podinfo and is Ready"
      type: "file"
      source: "validation/validate-repository.sh"
    - name: "validate-chart"
      description: "Confirms the HelmChart of the release uses the HelmRepository podinfo and is Ready on a 6.x version"
      type: "file"
      source: "validation/validate-chart.sh"
    - name: "validate-release"
      description: "Confirms the HelmRelease podinfo is Ready and podinfo runs in the namespace podinfo"
      type: "file"
      source: "validation/validate-release.sh"
    - name: "validate-objects-kept"
      description: "Confirms the HelmRepository and the HelmRelease were fixed in place"
      type: "file"
      source: "validation/validate-objects-kept.sh"

teardown:
  keepCluster: false
