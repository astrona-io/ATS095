# Repair A Bucket Source
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and controllers, and the S3-compatible server with its client pod"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-capstone-040-setup"
      description: "Fills the bucket podinfo and applies a Secret, Bucket and Flux Kustomization with several faults"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-bucket"
      description: "Confirms the Bucket podinfo reads the bucket podinfo over HTTP and is Ready"
      type: "file"
      source: "validation/validate-bucket.sh"
    - name: "validate-secret"
      description: "Confirms the Secret s3-credentials holds the keys accesskey and secretkey"
      type: "file"
      source: "validation/validate-secret.sh"
    - name: "validate-sync"
      description: "Confirms the Flux Kustomization podinfo applies the bucket root and podinfo runs 2 ready replicas"
      type: "file"
      source: "validation/validate-sync.sh"
    - name: "validate-objects-kept"
      description: "Confirms the Bucket and the Flux Kustomization were fixed in place"
      type: "file"
      source: "validation/validate-objects-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - amazon/aws-cli:2.38.4
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - versity/versitygw:v1.9.0
