# Deliver From A Bucket And Trigger A Reconcile
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and controllers, and the S3-compatible server with its client pod"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-lab-040-01-setup"
      description: "Fills the bucket podinfo with the podinfo manifests"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-bucket"
      description: "Confirms the Bucket podinfo reads the bucket podinfo over HTTP every 30 minutes and is Ready"
      type: "file"
      source: "validation/validate-bucket.sh"
    - name: "validate-secret"
      description: "Confirms the Secret s3-credentials holds the keys accesskey and secretkey"
      type: "file"
      source: "validation/validate-secret.sh"
    - name: "validate-change-applied"
      description: "Confirms the bucket holds the 3-replica change and Flux applied it from the Bucket revision"
      type: "file"
      source: "validation/validate-change-applied.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - amazon/aws-cli:2.38.4
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - versity/versitygw:v1.9.0
