# Trigger A Bucket From A Webhook
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and controllers, and the S3-compatible server with its client pod"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-lab-040-02-setup"
      description: "Fills the bucket podinfo and creates the Secret, the Bucket (30m) and the Flux Kustomization"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-receiver"
      description: "Confirms a generic Receiver with a token Secret is Ready and selects the Bucket podinfo"
      type: "file"
      source: "validation/validate-receiver.sh"
    - name: "validate-bucket-unchanged"
      description: "Confirms the Bucket podinfo still checks every 30 minutes and is Ready"
      type: "file"
      source: "validation/validate-bucket-unchanged.sh"
    - name: "validate-change-applied"
      description: "Confirms the 3-replica change was uploaded, a reconcile was handled and Flux applied the Bucket revision"
      type: "file"
      source: "validation/validate-change-applied.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - amazon/aws-cli:2.38.4
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - versity/versitygw:v1.9.0
