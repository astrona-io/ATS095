    prompt: "Where do you read why a `Bucket` cannot reach the server?"
    options:
      - id: a
        text: "The message of the `FetchFailed` condition"
        explanation: "Correct. The server's answer is in the message."
      - id: b
        text: "`status.artifact.size`"
        explanation: "Not correct. `status.artifact.size` is not the answer here. The server's answer is in the message."
      - id: c
        text: "The Flux Kustomization events only"
        explanation: "Not correct. The Flux Kustomization events only is not the answer here. The server's answer is in the message."
      - id: d
        text: "The pod log of kustomize-controller"
        explanation: "Not correct. The pod log of kustomize-controller is not the answer here. The server's answer is in the message."
    correct_option: a
    explanation: "Correct. The server's answer is in the message."

  - id: ats095-040-m1b-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Plain HTTP fault"
    source_readings:
      - sections/section-040/module-01/course-04-bucket-status-and-troubleshooting.md
    prompt: "A server answers plain HTTP and the `Bucket` has `insecure: false`. What fails?"
    options:
      - id: a
        text: "The request fails during the TLS handshake"
        explanation: "Correct. The fix is `insecure: true` for a plain-HTTP lab server."
      - id: b
        text: "The Secret is rejected"
        explanation: "Not correct. The Secret is rejected is not the answer here. The fix is `insecure: true` for a plain-HTTP lab server."
      - id: c
        text: "The prefix is ignored"
        explanation: "Not correct. The prefix is ignored is not the answer here. The fix is `insecure: true` for a plain-HTTP lab server."
      - id: d
        text: "The interval is too long"
        explanation: "Not correct. The interval is too long is not the answer here. The fix is `insecure: true` for a plain-HTTP lab server."
    correct_option: a
    explanation: "Correct. The fix is `insecure: true` for a plain-HTTP lab server."

