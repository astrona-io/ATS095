# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats095-040
course_id: ATS095
exam_code: FLUX
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Bucket Sources, Triggers And Artifacts"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats095-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Create the Secret for a Bucket"
    source_readings:
      - sections/section-040/module-01/course-01-bucket-sources.md
    prompt: "Which keys must the Secret for a `Bucket` with the `generic` provider contain?"
    options:
      - id: a
        text: "`username` and `password`"
        explanation: "Not correct. Those keys are for Git and Helm credentials."
      - id: b
        text: "`access_key` and `secret_key`"
        explanation: "Not correct. The names are exact and have no underscores."
      - id: c
        text: "`identity` and `known_hosts`"
        explanation: "Not correct. Those keys are for SSH."
      - id: d
        text: "`accesskey` and `secretkey`"
        explanation: "Correct. Other names such as `access_key` are ignored."
    correct_option: d
    explanation: "Correct. Other names such as `access_key` are ignored."

  - id: ats095-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Write the endpoint of a Bucket"
    source_readings:
      - sections/section-040/module-01/course-01-bucket-sources.md
    prompt: "How do you point a `generic` `Bucket` at a plain-HTTP S3 server?"
    options:
      - id: a
        text: "Give the host and port in `endpoint` and set `insecure: true`."
        explanation: "Correct. `endpoint` has no scheme."
      - id: b
        text: "Write `http://` at the start of `endpoint`."
        explanation: "Not correct. The scheme does not choose HTTP."
      - id: c
        text: "Set `provider: http`."
        explanation: "Not correct. The providers are generic, aws, gcp and azure."
      - id: d
        text: "Put the address in `bucketName`."
        explanation: "Not correct. `bucketName` is only the name of the bucket."
    correct_option: a
    explanation: "Correct. `endpoint` has no scheme."

  - id: ats095-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain a bucket revision"
    source_readings:
      - sections/section-040/module-01/course-01-bucket-sources.md
    prompt: "What is the revision of a `Bucket`?"
    options:
      - id: a
        text: "The time of the last upload."
        explanation: "Not correct. The revision follows the content, not the time."
      - id: b
        text: "The `sha256` of the list of object keys with their ETags."
        explanation: "Correct. Any content change changes an ETag and so the revision."
      - id: c
        text: "The version number of the bucket."
        explanation: "Not correct. A bucket has no version in this sense."
      - id: d
        text: "The commit of the repository that filled the bucket."
        explanation: "Not correct. A bucket has no commits."
    correct_option: b
    explanation: "Correct. Any content change changes an ETag and so the revision."

  - id: ats095-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an identical upload"
    source_readings:
      - sections/section-040/module-01/course-02-triggers-and-artifacts.md
    prompt: "You upload an unchanged `deployment.yaml` again and reconcile the `Bucket`. What happens to the revision?"
    options:
      - id: a
        text: "It changes, because the upload time is new."
        explanation: "Not correct. Time is not part of the revision."
      - id: b
        text: "It changes only if `interval` has passed."
        explanation: "Not correct. The content decides, not the interval."
      - id: c
        text: "It stays the same, because the ETags did not change."
        explanation: "Correct. Source-controller keeps the artifact it has."
      - id: d
        text: "The `Bucket` becomes not ready."
        explanation: "Not correct. An identical upload is harmless."
    correct_option: c
    explanation: "Correct. Source-controller keeps the artifact it has."

  - id: ats095-040-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain polling delay"
    source_readings:
      - sections/section-040/module-01/course-02-triggers-and-artifacts.md
    prompt: "The `Bucket` has `interval: 30m`. You upload a change. Why does the cluster not change at once?"
    options:
      - id: a
        text: "The upload is cached for 30 minutes by the S3 server."
        explanation: "Not correct. The delay is in source-controller's schedule."
      - id: b
        text: "kustomize-controller ignores buckets."
        explanation: "Not correct. It applies a `Bucket` artifact like a Git artifact."
      - id: c
        text: "The Secret must be recreated after each upload."
        explanation: "Not correct. The Secret is not involved."
      - id: d
        text: "source-controller does not watch the bucket and only checks it once per interval."
        explanation: "Correct. The next check can be 30 minutes away."
    correct_option: d
    explanation: "Correct. The next check can be 30 minutes away."

  - id: ats095-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Trigger a reconciliation"
    source_readings:
      - sections/section-040/module-01/course-02-triggers-and-artifacts.md
    prompt: "Which annotation makes a Flux controller reconcile an object at once?"
    options:
      - id: a
        text: "`reconcile.fluxcd.io/requestedAt` with a new value"
        explanation: "Correct. `flux reconcile` sets it for you."
      - id: b
        text: "`reconcile.fluxcd.io/interval` set to `0`"
        explanation: "Not correct. No such annotation exists."
      - id: c
        text: "`source.toolkit.fluxcd.io/suspend` set to `false`"
        explanation: "Not correct. That is not a reconcile request."
      - id: d
        text: "`reconcile.fluxcd.io/requestedAt` with the same value as before"
        explanation: "Not correct. The controller only reacts to a new value."
    correct_option: a
    explanation: "Correct. `flux reconcile` sets it for you."

  - id: ats095-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use --with-source"
    source_readings:
      - sections/section-040/module-01/course-02-triggers-and-artifacts.md
    prompt: "What does `flux reconcile kustomization podinfo` do without `--with-source`?"
    options:
      - id: a
        text: "It fetches the bucket and then applies it."
        explanation: "Not correct. That is what `--with-source` adds."
      - id: b
        text: "It applies the artifact the source already has, without fetching a new one."
        explanation: "Correct. Add `--with-source` or reconcile the source first."
      - id: c
        text: "It shortens the interval of the `Bucket`."
        explanation: "Not correct. Intervals are not changed."
      - id: d
        text: "It deletes the stored artifact."
        explanation: "Not correct. Artifacts are removed by garbage collection."
    correct_option: b
    explanation: "Correct. Add `--with-source` or reconcile the source first."

  - id: ats095-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Know what a Receiver does"
    source_readings:
      - sections/section-040/module-01/course-02-triggers-and-artifacts.md
    prompt: "What does a `Receiver` do when a webhook event arrives?"
    options:
      - id: a
        text: "It uploads the changed files to the bucket."
        explanation: "Not correct. It does not change content."
      - id: b
        text: "It changes the `interval` of the source to `1s`."
        explanation: "Not correct. Intervals stay as they are."
      - id: c
        text: "It sets the reconcile request annotation, so the source fetches at once."
        explanation: "Correct. This avoids polling with a short interval."
      - id: d
        text: "It restarts source-controller."
        explanation: "Not correct. It sets an annotation only."
    correct_option: c
    explanation: "Correct. This avoids polling with a short interval."

  - id: ats095-040-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Read the artifact status"
    source_readings:
      - sections/section-040/module-01/course-02-triggers-and-artifacts.md
    prompt: "In `status.artifact`, what is the `digest` field?"
    options:
      - id: a
        text: "The hash of the object list."
        explanation: "Not correct. That is the `revision` of a `Bucket`."
      - id: b
        text: "The address where the file is served."
        explanation: "Not correct. That is `url`."
      - id: c
        text: "The time the artifact was stored."
        explanation: "Not correct. That is `lastUpdateTime`."
      - id: d
        text: "The hash of the stored `tar.gz` file."
        explanation: "Correct. The `revision` is the source's own version."
    correct_option: d
    explanation: "Correct. The `revision` is the source's own version."

  - id: ats095-040-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the artifact retention default"
    source_readings:
      - sections/section-040/module-01/course-02-triggers-and-artifacts.md
    prompt: "What does the default `--artifact-retention-records=2` of source-controller mean?"
    options:
      - id: a
        text: "It keeps the two newest artifacts of each object and collects older ones."
        explanation: "Correct. Old ones are deleted after `--artifact-retention-ttl`."
      - id: b
        text: "It keeps two artifacts in total for all objects."
        explanation: "Not correct. The limit is per object."
      - id: c
        text: "It retries a failed fetch two times."
        explanation: "Not correct. It does not control retries."
      - id: d
        text: "It allows two sources per namespace."
        explanation: "Not correct. It does not limit objects."
    correct_option: a
    explanation: "Correct. Old ones are deleted after `--artifact-retention-ttl`."

  - id: ats095-040-m1b-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Provider default"
    source_readings:
      - sections/section-040/module-01/course-03-providers-prefix-and-ignore-rules.md
    prompt: "Which `spec.provider` is the default of a `Bucket`?"
    options:
      - id: a
        text: "`generic`"
        explanation: "Correct. It fits any S3-compatible server and reads `accesskey` and `secretkey`."
      - id: b
        text: "`aws`"
        explanation: "Not correct. `aws` is not the answer here. It fits any S3-compatible server and reads `accesskey` and `secretkey`."
      - id: c
        text: "`s3`"
        explanation: "Not correct. `s3` is not the answer here. It fits any S3-compatible server and reads `accesskey` and `secretkey`."
      - id: d
        text: "`minio`"
        explanation: "Not correct. `minio` is not the answer here. It fits any S3-compatible server and reads `accesskey` and `secretkey`."
    correct_option: a
    explanation: "Correct. It fits any S3-compatible server and reads `accesskey` and `secretkey`."

  - id: ats095-040-m1b-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prefix effect"
    source_readings:
      - sections/section-040/module-01/course-03-providers-prefix-and-ignore-rules.md
    prompt: "What does `spec.prefix: staging/` do?"
    options:
      - id: a
        text: "Only keys that start with `staging/` are listed and part of the revision"
        explanation: "Correct. The filter runs on the server while the objects are listed."
      - id: b
        text: "It hides staging from the artifact after the download"
        explanation: "Not correct. It hides staging from the artifact after the download is not the answer here. The filter runs on the server while the objects are listed."
      - id: c
        text: "It renames the keys"
        explanation: "Not correct. It renames the keys is not the answer here. The filter runs on the server while the objects are listed."
      - id: d
        text: "It sets the path of the Flux Kustomization"
        explanation: "Not correct. It sets the path of the Flux Kustomization is not the answer here. The filter runs on the server while the objects are listed."
    correct_option: a
    explanation: "Correct. The filter runs on the server while the objects are listed."

  - id: ats095-040-m1b-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prefix and revision"
    source_readings:
      - sections/section-040/module-01/course-03-providers-prefix-and-ignore-rules.md
    prompt: "A key outside the prefix changes. What happens to the revision of the `Bucket`?"
    options:
      - id: a
        text: "It stays the same"
        explanation: "Correct. The revision comes only from the keys that were listed."
      - id: b
        text: "It changes"
        explanation: "Not correct. It changes is not the answer here. The revision comes only from the keys that were listed."
      - id: c
        text: "The source fails"
        explanation: "Not correct. The source fails is not the answer here. The revision comes only from the keys that were listed."
      - id: d
        text: "The source is suspended"
        explanation: "Not correct. The source is suspended is not the answer here. The revision comes only from the keys that were listed."
    correct_option: a
    explanation: "Correct. The revision comes only from the keys that were listed."

  - id: ats095-040-m1b-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Path after a prefix"
    source_readings:
      - sections/section-040/module-01/course-03-providers-prefix-and-ignore-rules.md
    prompt: "With `prefix: staging/`, which `path` does the Flux Kustomization use for those files?"
    options:
      - id: a
        text: "`./staging`"
        explanation: "Correct. The artifact keeps the full key, so the folder stays."
      - id: b
        text: "`./`"
        explanation: "Not correct. `./` is not the answer here. The artifact keeps the full key, so the folder stays."
      - id: c
        text: "`./prefix`"
        explanation: "Not correct. `./prefix` is not the answer here. The artifact keeps the full key, so the folder stays."
      - id: d
        text: "`./staging/staging`"
        explanation: "Not correct. `./staging/staging` is not the answer here. The artifact keeps the full key, so the folder stays."
    correct_option: a
    explanation: "Correct. The artifact keeps the full key, so the folder stays."

  - id: ats095-040-m1b-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Ignore syntax"
    source_readings:
      - sections/section-040/module-01/course-03-providers-prefix-and-ignore-rules.md
    prompt: "Which syntax does `spec.ignore` use?"
    options:
      - id: a
        text: "`.gitignore` patterns"
        explanation: "Correct. `draft/` and `*.bak` are valid; a regular expression is not."
      - id: b
        text: "Regular expressions"
        explanation: "Not correct. Regular expressions is not the answer here. `draft/` and `*.bak` are valid; a regular expression is not."
      - id: c
        text: "Glob without negation"
        explanation: "Not correct. Glob without negation is not the answer here. `draft/` and `*.bak` are valid; a regular expression is not."
      - id: d
        text: "JSON paths"
        explanation: "Not correct. JSON paths is not the answer here. `draft/` and `*.bak` are valid; a regular expression is not."
    correct_option: a
    explanation: "Correct. `draft/` and `*.bak` are valid; a regular expression is not."

  - id: ats095-040-m1b-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Ignore and security"
    source_readings:
      - sections/section-040/module-01/course-03-providers-prefix-and-ignore-rules.md
    prompt: "Is `spec.ignore` a security boundary for objects in the bucket?"
    options:
      - id: a
        text: "No, ignored keys are still listed and readable with the credentials"
        explanation: "Correct. Restrict the key on the server for a real boundary."
      - id: b
        text: "Yes, they are encrypted"
        explanation: "Not correct. Yes, they are encrypted is not the answer here. Restrict the key on the server for a real boundary."
      - id: c
        text: "Yes, the server hides them"
        explanation: "Not correct. Yes, the server hides them is not the answer here. Restrict the key on the server for a real boundary."
      - id: d
        text: "Only for the generic provider"
        explanation: "Not correct. Only for the generic provider is not the answer here. Restrict the key on the server for a real boundary."
    correct_option: a
    explanation: "Correct. Restrict the key on the server for a real boundary."

  - id: ats095-040-m1b-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Where ignore patterns come from"
    source_readings:
      - sections/section-040/module-01/course-03-providers-prefix-and-ignore-rules.md
    prompt: "If the bucket root has a `.sourceignore` and `spec.ignore` is set, what applies?"
    options:
      - id: a
        text: "Both, with the patterns of the spec added after the file so they win"
        explanation: "Correct. The file is read first and the spec patterns are added after it."
      - id: b
        text: "Only the file"
        explanation: "Not correct. Only the file is not the answer here. The file is read first and the spec patterns are added after it."
      - id: c
        text: "Only the spec"
        explanation: "Not correct. Only the spec is not the answer here. The file is read first and the spec patterns are added after it."
      - id: d
        text: "Neither"
        explanation: "Not correct. Neither is not the answer here. The file is read first and the spec patterns are added after it."
    correct_option: a
    explanation: "Correct. The file is read first and the spec patterns are added after it."

