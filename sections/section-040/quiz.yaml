  - id: ats095-040-m2-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Signed type"
    source_readings:
      - sections/section-040/module-02/course-02-receiver-types-tokens-and-exposure.md
    prompt: "Which Receiver type checks an HMAC in the header `X-Signature`?"
    options:
      - id: a
