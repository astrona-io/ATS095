# Prove What source-controller Stored
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-095-lab-050-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-services-and-flux"
      description: "Installs the Flux CLI 2.9.6 and controllers, Gitea, the CoreDNS rewrite, and seeds gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-095-lab-050-01-setup"
      description: "Connects Flux to gitops/fleet over HTTP, starts the artifact-reader pod in flux-system and records the initial revision in lab-initial"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until the lab services and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-proof"
      description: "Confirms the ConfigMap artifact-proof names the revision fleet serves now and not the initial one"
      type: "file"
      source: "validation/validate-proof.sh"
    - name: "validate-digest"
      description: "Recomputes the sha256 digest and the file count from the served artifact and compares them with artifact-proof"
      type: "file"
      source: "validation/validate-digest.sh"
    - name: "validate-scaled"
      description: "Confirms podinfo applies the new revision and runs 4 ready replicas"
      type: "file"
      source: "validation/validate-scaled.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
